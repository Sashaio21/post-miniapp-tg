<!doctype html>
<html lang="ru">
<head>
<title>Готово — {{ pack.name }}</title>
{% include "_head.html" %}
<style>

  .nav{ display:flex; gap:16px; margin-bottom:14px; font-size:13px; }
  .nav a{ color:var(--paper-70); text-decoration:none; } .nav a:hover{ color:var(--paper); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin:20px 0; }
  .card{ border:1px solid var(--paper-14); border-radius:12px; overflow:hidden; background:var(--panel); }
  .card .thumb img{ display:block; width:100%; height:auto; background:#000; }
  .card-body{ padding:10px 12px 12px; }
  .card-title{ font-size:13px; font-weight:600; } .card-dims{ font:500 11px 'JetBrains Mono',monospace; color:var(--paper-70); margin:3px 0 8px; }
  a.download{ display:block; text-align:center; padding:9px; border-radius:9px; border:1px solid var(--paper-14); color:var(--paper); font-size:13px; text-decoration:none; }
  a.download:hover{ border-color:var(--brick); }
  a.zip{ background:var(--brick); border-color:var(--brick); padding:14px; font-weight:600; border-radius:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="/t/{{ pack.id }}">← К шаблону</a><a href="/">Все шаблоны</a></div>
  <h1>Готово</h1>
  <p class="subtitle">{{ pack.name }} · {{ cards|length }} шт.</p>
  <div class="grid">
    {% for c in cards %}
    <div class="card">
      <div class="thumb"><img src="/output/{{ c.file }}" alt="{{ c.label }}"></div>
      <div class="card-body">
        <div class="card-title">{{ c.label }}</div>
        <div class="card-dims">{{ c.dims }}</div>
        <a class="download" href="/output/{{ c.file }}" download>Скачать PNG</a>
      </div>
    </div>
    {% endfor %}
  </div>
  <a class="download zip" href="/output/{{ zip_file }}" download>Скачать всё (zip)</a>
  {% include "_tg_send.html" %}
</div>
</body>
</html>
